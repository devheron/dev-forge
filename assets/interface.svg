I, Arial, sans-serif" font-size="11" font-weight="bold">✓</text><text x="55" y="434" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Git</text><text x="332" y="434" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="493" width="12" height="12" rx="2" fill="#64dab6"/><text x="35" y="503" fill="#101927" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">✓</text><text x="55" y="504" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Node.js LTS + npm</text><text x="332" y="504" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="526" width="12" height="12" rx="2" fill="#34465d"/><text x="55" y="537" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Python 3</text><text x="332" y="537" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="559" width="12" height="12" rx="2" fill="#34465d"/><text x="55" y="570" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Ruby</text><text x="332" y="570" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="592" width="12" height="12" rx="2" fill="#34465d"/><text x="55" y="603" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">R</text><text x="332" y="603" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="625" width="12" height="12" rx="2" fill="#34465d"/><text x="55" y="636" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Go</text><text x="332" y="636" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text><rect x="34" y="658" width="12" height="12" rx="2" fill="#34465d"/><text x="55" y="669" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Java 21 JDK</text><text x="332" y="669" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal">↗</text></g><g clip-path="url(#code)"><text x="423" y="409" fill="#64dab6" font-family="Consolas, monospace" font-size="12" font-weight="normal">COMANDOS DE INSTALAÇÃO</text><text x="423" y="435" fill="#8597ac" font-family="Consolas, monospace" font-size="12" font-weight="normal"># Dev Forge - revise antes de executar</text><text x="423" y="454" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">$ErrorActionPreference = &#x27;Stop&#x27;</text><text x="423" y="473" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw &#x27;Instale App Installer /</text><text x="423" y="488" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">WinGet pela Microsoft Store.&#x27; }</text><text x="423" y="507" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">Start-Transcript -Path (Join-Path $PSScriptRoot (&#x27;install-&#x27; + (Get-Date -Format yyyyMMdd-HHmmss) +</text><text x="423" y="522" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">&#x27;.log&#x27;))</text><text x="423" y="541" fill="#e2b77c" font-family="Consolas, monospace" font-size="12" font-weight="normal">try {</text><text x="423" y="560" fill="#cee7ef" font-family="Consolas, monospace" font-size="12" font-weight="normal">Write-Host &#x27;Instalando Git&#x27;</text><text x="423" y="579" fill="#79beff" font-family="Consolas, monospace" font-size="12" font-weight="normal">winget install --id Git.Git --exact --source winget --accept-source-agreements</text></g><text x="405" y="617" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal">Fontes: WinGet, repositórios apt e documentação oficial.</text><text x="20" y="690" fill="#98aac0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">5 selecionadas  ·  5 com dependências  ·  1 referências manuais</text><rect x="20" y="706" width="279" height="35" rx="5" fill="#26384e"/><text x="34" y="727.5" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Copiar comandos</text><rect x="305" y="706" width="279" height="35" rx="5" fill="#26384e"/><text x="319" y="727.5" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Salvar script</text><rect x="590" y="706" width="279" height="35" rx="5" fill="#26384e"/><text x="604" y="727.5" fill="#e7edf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal">Etapas após instalação</text><rect x="875" y="706" width="279" height="35" rx="5" fill="#64dab6"/><text x="889" y="727.5" fill="#101927" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Instalar selecionados</text></svg>