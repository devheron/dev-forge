name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,json; assert os.environ['RELEASE_TAG'] == 'v' + json.load(open('version.json'))['version']"
      - run: python -m unittest discover -s tests -v
      - run: python package_release.py
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dev-forge.zip --title "Dev Forge $RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag
