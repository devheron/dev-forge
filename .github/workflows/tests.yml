name: Verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py ui.py engine.py catalog.py updater.py runtime.py shortcuts.py package_release.py build_desktop.py publish_release.py prepare_release.py desktop_entry.py

